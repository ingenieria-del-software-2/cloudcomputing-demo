name: belo

x-aws-local: &aws-local
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://ministack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

x-service-meta: &service-meta
  GIT_COMMIT: compose

x-curl-one-shot: &curl-one-shot
  image: curlimages/curl:8.16.0
  restart: "no"

x-node-healthcheck: &node-healthcheck
  test:
    - CMD-SHELL
    - >-
      node -e "fetch('http://127.0.0.1:' + process.env.PORT + '/readyz')
      .then(r => process.exit(r.ok ? 0 : 1))
      .catch(() => process.exit(1))"
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  ministack:
    image: ministackorg/ministack:1.3.25
    environment:
      LOG_LEVEL: INFO
      PERSIST_STATE: "0"
    ports:
      - name: aws
        target: 4566
        published: "${MINISTACK_PORT:-4566}"
        protocol: tcp
        app_protocol: http

  ministack-ready:
    <<: *curl-one-shot
    depends_on:
      ministack:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - >-
        until curl -fsS http://ministack:4566/_ministack/health >/dev/null;
        do sleep 1; done

  receipt-queue:
    <<: *curl-one-shot
    depends_on:
      ministack-ready:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - >-
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=receipt-commands&Version=2012-11-05'
        >/dev/null

  orders-confirmed-queue:
    <<: *curl-one-shot
    depends_on:
      ministack-ready:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - >-
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=orders-confirmed-dlq&Version=2012-11-05'
        >/dev/null;
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=orders-confirmed-intake&Version=2012-11-05'
        --data 'Attribute.1.Name=RedrivePolicy'
        --data-urlencode 'Attribute.1.Value={"deadLetterTargetArn":"arn:aws:sqs:us-east-1:000000000000:orders-confirmed-dlq","maxReceiveCount":"3"}'
        >/dev/null

  payments-approved-queue:
    <<: *curl-one-shot
    depends_on:
      ministack-ready:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - >-
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=payments-approved-dlq&Version=2012-11-05'
        >/dev/null;
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=payments-approved-intake&Version=2012-11-05'
        --data 'Attribute.1.Name=RedrivePolicy'
        --data-urlencode 'Attribute.1.Value={"deadLetterTargetArn":"arn:aws:sqs:us-east-1:000000000000:payments-approved-dlq","maxReceiveCount":"3"}'
        >/dev/null

  fulfillment-commitment-queue:
    <<: *curl-one-shot
    depends_on:
      ministack-ready:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - >-
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=fulfillment-commitment-dlq&Version=2012-11-05'
        >/dev/null;
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=fulfillment-commitment-intake&Version=2012-11-05'
        --data 'Attribute.1.Name=RedrivePolicy'
        --data-urlencode 'Attribute.1.Value={"deadLetterTargetArn":"arn:aws:sqs:us-east-1:000000000000:fulfillment-commitment-dlq","maxReceiveCount":"3"}'
        >/dev/null

  buyer-tracking-queue:
    <<: *curl-one-shot
    depends_on:
      ministack-ready:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - >-
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=buyer-tracking-events-dlq&Version=2012-11-05'
        >/dev/null;
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=buyer-tracking-events&Version=2012-11-05'
        --data 'Attribute.1.Name=RedrivePolicy'
        --data-urlencode 'Attribute.1.Value={"deadLetterTargetArn":"arn:aws:sqs:us-east-1:000000000000:buyer-tracking-events-dlq","maxReceiveCount":"3"}'
        >/dev/null

  customer-experience-queue:
    <<: *curl-one-shot
    depends_on:
      ministack-ready:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - >-
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=customer-experience-events-dlq&Version=2012-11-05'
        >/dev/null;
        curl -fsS -X POST http://ministack:4566/
        -H 'Content-Type: application/x-www-form-urlencoded'
        --data 'Action=CreateQueue&QueueName=customer-experience-events&Version=2012-11-05'
        --data 'Attribute.1.Name=RedrivePolicy'
        --data-urlencode 'Attribute.1.Value={"deadLetterTargetArn":"arn:aws:sqs:us-east-1:000000000000:customer-experience-events-dlq","maxReceiveCount":"3"}'
        >/dev/null

  shipment-documents-bucket:
    <<: *curl-one-shot
    depends_on:
      ministack-ready:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - >-
        curl -fsS -X PUT http://ministack:4566/seller-dispatch-documents-lab
        >/dev/null

  order-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_management
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      - name: order-postgres
        target: 5432
        published: "${ORDER_POSTGRES_PORT:-15432}"
        protocol: tcp
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U order -d order_management
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  fulfillment-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fulfillment_planning
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: fulfillment
    ports:
      - name: fulfillment-postgres
        target: 5432
        published: "${FULFILLMENT_POSTGRES_PORT:-15433}"
        protocol: tcp
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U fulfillment -d fulfillment_planning
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  shipment-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shipment_preparation
      POSTGRES_USER: shipment
      POSTGRES_PASSWORD: shipment
    ports:
      - name: shipment-postgres
        target: 5432
        published: "${SHIPMENT_POSTGRES_PORT:-15434}"
        protocol: tcp
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U shipment -d shipment_preparation
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  ledger-service:
    image: ledger-service:local
    build:
      context: .
      dockerfile: build/docker/ledger-service.Dockerfile
    environment:
      <<: *service-meta
      HOST: 0.0.0.0
      PORT: "3001"
      SERVICE_VERSION: stable
    ports:
      - name: ledger
        target: 3001
        published: "${LEDGER_PORT:-3001}"
        protocol: tcp
        app_protocol: http

  ledger-ready:
    <<: *curl-one-shot
    depends_on:
      ledger-service:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - >-
        until curl -fsS http://ledger-service:3001/readyz >/dev/null;
        do sleep 1; done

  transaction-api:
    image: transaction-api:local
    build:
      context: .
      dockerfile: build/docker/transaction-api.Dockerfile
    depends_on:
      ledger-ready:
        condition: service_completed_successfully
      receipt-queue:
        condition: service_completed_successfully
    environment:
      <<: [*aws-local, *service-meta]
      NODE_ENV: production
      PORT: "3000"
      SERVICE_VERSION: v1
      LEDGER_BASE_URL: http://ledger-service:3001
      SQS_QUEUE_URL: http://ministack:4566/000000000000/receipt-commands
      SQS_PUBLISH_MAX_ATTEMPTS: "2"
      SQS_PUBLISH_RETRY_DELAY_MS: "0"
      READY_CHECK_TIMEOUT_MS: "500"
    ports:
      - name: http
        target: 3000
        published: "${TRANSACTION_API_PORT:-3000}"
        protocol: tcp
        app_protocol: http
    healthcheck: *node-healthcheck

  order-management:
    image: order-management:local
    build:
      context: .
      dockerfile: build/docker/order-management.Dockerfile
    depends_on:
      payments-approved-queue:
        condition: service_completed_successfully
      orders-confirmed-queue:
        condition: service_completed_successfully
      buyer-tracking-queue:
        condition: service_completed_successfully
      order-postgres:
        condition: service_healthy
    environment:
      <<: [*aws-local, *service-meta]
      NODE_ENV: production
      PORT: "3000"
      SERVICE_VERSION: v1
      DATABASE_URL: postgresql://order:order@order-postgres:5432/order_management
      PAYMENT_INTAKE_CONSUMER_ENABLED: "${PAYMENT_INTAKE_CONSUMER_ENABLED:-true}"
      PAYMENT_INTAKE_SQS_QUEUE_URL: http://ministack:4566/000000000000/payments-approved-intake
      SQS_QUEUE_URL: http://ministack:4566/000000000000/orders-confirmed-intake
      TRACKING_SQS_QUEUE_URL: http://ministack:4566/000000000000/buyer-tracking-events
      IDEMPOTENCY_ENABLED: "true"
      READY_CHECK_TIMEOUT_MS: "500"
    ports:
      - name: order-http
        target: 3000
        published: "${ORDER_MANAGEMENT_PORT:-3010}"
        protocol: tcp
        app_protocol: http
    healthcheck: *node-healthcheck

  fulfillment-planning:
    image: fulfillment-planning:local
    build:
      context: .
      dockerfile: build/docker/fulfillment-planning.Dockerfile
    depends_on:
      orders-confirmed-queue:
        condition: service_completed_successfully
      fulfillment-commitment-queue:
        condition: service_completed_successfully
      buyer-tracking-queue:
        condition: service_completed_successfully
      fulfillment-postgres:
        condition: service_healthy
    environment:
      <<: [*aws-local, *service-meta]
      NODE_ENV: production
      PORT: "3000"
      SERVICE_VERSION: v1
      DATABASE_URL: postgresql://fulfillment:fulfillment@fulfillment-postgres:5432/fulfillment_planning
      INPUT_SQS_QUEUE_URL: http://ministack:4566/000000000000/orders-confirmed-intake
      SQS_QUEUE_URL: http://ministack:4566/000000000000/fulfillment-commitment-intake
      TRACKING_SQS_QUEUE_URL: http://ministack:4566/000000000000/buyer-tracking-events
      PROMESA_EXPRESS_ENABLED: "true"
      PROMESA_EXPRESS_LATENCY_MS: "${PROMESA_EXPRESS_LATENCY_MS:-750}"
      PROMESA_EXPRESS_ERROR_RATE: "${PROMESA_EXPRESS_ERROR_RATE:-0.25}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"
      READY_CHECK_TIMEOUT_MS: "500"
    ports:
      - name: fulfillment-http
        target: 3000
        published: "${FULFILLMENT_PLANNING_PORT:-3020}"
        protocol: tcp
        app_protocol: http
    healthcheck: *node-healthcheck

  shipment-preparation:
    image: shipment-preparation:local
    build:
      context: .
      dockerfile: build/docker/shipment-preparation.Dockerfile
    depends_on:
      fulfillment-commitment-queue:
        condition: service_completed_successfully
      buyer-tracking-queue:
        condition: service_completed_successfully
      shipment-documents-bucket:
        condition: service_completed_successfully
      shipment-postgres:
        condition: service_healthy
    environment:
      <<: [*aws-local, *service-meta]
      NODE_ENV: production
      PORT: "3000"
      SERVICE_VERSION: v1
      DATABASE_URL: postgresql://shipment:shipment@shipment-postgres:5432/shipment_preparation
      INPUT_SQS_QUEUE_URL: http://ministack:4566/000000000000/fulfillment-commitment-intake
      SQS_QUEUE_URL: http://ministack:4566/000000000000/buyer-tracking-events
      SHIPMENT_DOCUMENTS_BUCKET: seller-dispatch-documents-lab
      S3_BAD_KEY_ENABLED: "false"
      S3_PUT_OBJECT_ALLOWED: "${S3_PUT_OBJECT_ALLOWED:-true}"
      S3_TRANSIENT_FAILURES_BEFORE_SUCCESS: "0"
      S3_UPLOAD_MAX_ATTEMPTS: "2"
      S3_UPLOAD_RETRY_DELAY_MS: "25"
      SELLER_CUTOFF_EXPIRED: "false"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"
      READY_CHECK_TIMEOUT_MS: "500"
    ports:
      - name: shipment-http
        target: 3000
        published: "${SHIPMENT_PREPARATION_PORT:-3030}"
        protocol: tcp
        app_protocol: http
    healthcheck: *node-healthcheck

  buyer-order-tracking:
    image: buyer-order-tracking:local
    build:
      context: .
      dockerfile: build/docker/buyer-order-tracking.Dockerfile
    depends_on:
      buyer-tracking-queue:
        condition: service_completed_successfully
      customer-experience-queue:
        condition: service_completed_successfully
    environment:
      <<: [*aws-local, *service-meta]
      NODE_ENV: production
      PORT: "3000"
      SERVICE_VERSION: v1
      TRACKING_TABLE_NAME: buyer-visible-order-state
      BUYER_ORDERS_INDEX_NAME: buyer_id-order_id-index
      INPUT_SQS_QUEUE_URL: http://ministack:4566/000000000000/buyer-tracking-events
      SQS_QUEUE_URL: http://ministack:4566/000000000000/customer-experience-events
      TRACKING_CONSUMER_ENABLED: "true"
      TRACKING_CONSUMER_DELAY_MS: "0"
      TRACKING_MAX_MESSAGES_PER_POLL: "${TRACKING_MAX_MESSAGES_PER_POLL:-10}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"
      READY_CHECK_TIMEOUT_MS: "500"
    ports:
      - name: tracking-http
        target: 3000
        published: "${BUYER_ORDER_TRACKING_PORT:-3040}"
        protocol: tcp
        app_protocol: http
    healthcheck: *node-healthcheck

  receipt-worker:
    image: receipt-worker:local
    build:
      context: .
      dockerfile: build/docker/receipt-worker.Dockerfile
    depends_on:
      receipt-queue:
        condition: service_completed_successfully
    environment:
      <<: [*aws-local, *service-meta]
      NODE_ENV: production
      PORT: "3002"
      SERVICE_VERSION: stable
      SQS_QUEUE_URL: http://ministack:4566/000000000000/receipt-commands
    ports:
      - name: worker-http
        target: 3002
        published: "${RECEIPT_WORKER_PORT:-3002}"
        protocol: tcp
        app_protocol: http
    healthcheck: *node-healthcheck

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles:
      - metrics
    depends_on:
      transaction-api:
        condition: service_healthy
      order-management:
        condition: service_healthy
      fulfillment-planning:
        condition: service_healthy
      shipment-preparation:
        condition: service_healthy
      buyer-order-tracking:
        condition: service_healthy
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    ports:
      - name: prometheus
        target: 9090
        published: "${PROMETHEUS_PORT:-19090}"
        protocol: tcp
        app_protocol: http
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider -q http://127.0.0.1:9090/-/ready || exit 1
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 1s

      scrape_configs:
        - job_name: transaction-api
          static_configs:
            - targets:
                - transaction-api:3000
        - job_name: order-management
          static_configs:
            - targets:
                - order-management:3000
        - job_name: fulfillment-planning
          static_configs:
            - targets:
                - fulfillment-planning:3000
        - job_name: shipment-preparation
          static_configs:
            - targets:
                - shipment-preparation:3000
        - job_name: buyer-order-tracking
          static_configs:
            - targets:
                - buyer-order-tracking:3000
