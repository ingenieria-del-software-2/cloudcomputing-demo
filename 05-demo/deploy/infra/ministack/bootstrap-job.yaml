apiVersion: batch/v1
kind: Job
metadata:
  name: ministack-bootstrap-receipt-commands
  labels:
    app.kubernetes.io/name: ministack-bootstrap
    app.kubernetes.io/component: sqs-bootstrap
    app.kubernetes.io/part-of: belo
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ministack-bootstrap
        app.kubernetes.io/component: sqs-bootstrap
        app.kubernetes.io/part-of: belo
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-receipt-commands
          image: curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MINISTACK_ENDPOINT
              value: http://ministack:4566
            - name: QUEUE_NAME
              value: receipt-commands
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              until curl -fsS "${MINISTACK_ENDPOINT}/_ministack/health" >/dev/null; do
                sleep 1
              done

              curl -fsS -X POST "${MINISTACK_ENDPOINT}/" \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data "Action=CreateQueue&QueueName=${QUEUE_NAME}&Version=2012-11-05" \
                >/dev/null
