apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministack
  labels:
    app.kubernetes.io/name: ministack
    app.kubernetes.io/component: sqs-emulator
    app.kubernetes.io/part-of: belo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ministack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ministack
        app.kubernetes.io/component: sqs-emulator
        app.kubernetes.io/part-of: belo
    spec:
      containers:
        - name: ministack
          image: ministackorg/ministack:1.3.25
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: PERSIST_STATE
              value: "0"
          ports:
            - name: http
              containerPort: 4566
          readinessProbe:
            httpGet:
              path: /_ministack/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_ministack/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
