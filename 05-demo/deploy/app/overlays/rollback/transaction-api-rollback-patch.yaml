apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api
  namespace: belo
  labels:
    app.kubernetes.io/version: v2
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/version: v2
    spec:
      containers:
        - name: transaction-api
          env:
            - name: SERVICE_VERSION
              value: v2
            - name: GIT_COMMIT
              value: rollback
            - name: ERROR_RATE
              value: "10"
            - name: ERROR_CODE
              value: "500"
