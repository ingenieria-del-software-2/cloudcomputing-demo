apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: transaction-api-canary
  namespace: belo
  labels:
    app.kubernetes.io/name: transaction-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: belo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-api
  podMetricsEndpoints:
    - interval: 15s
      path: /metrics
      port: http
