apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: transaction-api-http-duration-p95
  namespace: belo
  labels:
    app.kubernetes.io/name: transaction-api
    app.kubernetes.io/component: canary-gate
    app.kubernetes.io/part-of: belo
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.monitoring:9090
  query: |
    histogram_quantile(
      0.95,
      sum(
        rate(http_request_duration_seconds_bucket{
          namespace="{{ namespace }}",
          route="/transactions",
          pod=~"transaction-api-[^-]+-[^-]+$"
        }[2m])
      ) by (le)
    ) or vector(999)
